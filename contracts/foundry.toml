[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.33"
optimizer = true
optimizer_runs = 200
via_ir = false
auto_detect_remappings = false
remappings = [
  "forge-std/=lib/forge-std/src/",
  "sooth-factory/=lib/sooth-factory/src/",
  "lib/sooth-factory/:src/=lib/sooth-factory/src/",
  "@openzeppelin/contracts/=lib/sooth-factory/lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"

[etherscan]
bsc = { key = "${BSCSCAN_API_KEY}", chain = 56 }

[fmt]
line_length = 90

[lint]
lint_on_build = false
